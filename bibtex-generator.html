<p>Generate a BibTeX entry from a DOI, arXiv URL, or Optimization Online reference.</p>

</div>

<pre id="bib-block" style="display: none; white-space: pre-wrap;"><code id="bib-output" class="language-latex hljs"></code></pre>

<p id="bib-status" role="status" aria-live="polite"></p>
<script src="{{ '/assets/js/bibtex-generator.js' | relative_url }}" defer></script>
